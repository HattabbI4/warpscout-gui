name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  build:
    needs: ci
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standalone
            self_contained: "true"
            extra_props: "-p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true"
          - variant: lite
            self_contained: "false"
            extra_props: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build (${{ matrix.variant }})
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_NUM=$(echo "$VERSION" | sed -E 's/^[vV]//; s/[^0-9.].*$//')
          [ -z "$VERSION_NUM" ] && VERSION_NUM="0.1.0"
          ASSET="warpscout-gui_${VERSION}_windows_amd64_${{ matrix.variant }}.exe"
          dotnet publish -c Release -r win-x64 \
            --self-contained ${{ matrix.self_contained }} \
            -p:PublishSingleFile=true \
            -p:Version="$VERSION_NUM" \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            ${{ matrix.extra_props }} \
            -o out
          mv out/warpscout-gui.exe "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          python3 .github/scripts/generate_release_notes.py \
            --tag "${GITHUB_REF_NAME}" \
            --output body.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: body.md
